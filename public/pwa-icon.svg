<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- 앱 아이콘 배경 (둥근 사각형) -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- 배경 장식 -->
  <circle cx="420" cy="80" r="170" fill="white" fill-opacity="0.055"/>
  <circle cx="90" cy="450" r="130" fill="white" fill-opacity="0.04"/>

  <!-- 문서 본체 -->
  <rect x="108" y="76" width="224" height="288" rx="18" fill="white"/>

  <!-- 접힌 모서리 -->
  <path d="M272 76 L332 76 L332 136 Z" fill="#c4b5fd"/>
  <path d="M272 76 L272 136 L332 136" fill="none" stroke="white" stroke-width="3" stroke-opacity="0.7"/>

  <!-- 문서 내용 선 -->
  <rect x="136" y="162" width="134" height="10" rx="5" fill="#ede9fe"/>
  <rect x="136" y="188" width="170" height="10" rx="5" fill="#ede9fe"/>
  <rect x="136" y="214" width="148" height="10" rx="5" fill="#ede9fe"/>
  <rect x="136" y="240" width="164" height="10" rx="5" fill="#ede9fe"/>
  <rect x="136" y="266" width="110" height="10" rx="5" fill="#ede9fe"/>

  <!-- 대각선 워터마크 텍스트 -->
  <text
    transform="translate(220, 246) rotate(-28)"
    font-family="Arial, Helvetica, sans-serif"
    font-size="31" font-weight="700"
    fill="#7c3aed" fill-opacity="0.48"
    text-anchor="middle" letter-spacing="2.5">WATERMARK</text>

  <!-- 하단 뱃지 원 -->
  <circle cx="366" cy="376" r="100" fill="#5b21b6"/>
  <circle cx="366" cy="376" r="91" fill="none" stroke="white" stroke-width="2.5" stroke-opacity="0.25"/>

  <!-- W 모노그램 -->
  <text
    x="366" y="424"
    font-family="Arial Black, Arial, sans-serif"
    font-size="104" font-weight="900"
    fill="white" text-anchor="middle">W</text>
</svg>
